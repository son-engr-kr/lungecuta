<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;width:960px;height:540px;overflow:hidden}
.card{position:absolute;left:60px;top:300px;padding:18px 28px;border-radius:14px;background:rgba(10,12,20,0.55);
      box-shadow:0 8px 30px rgba(0,0,0,0.45)}
.title{font:700 64px/1.1 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;
       background:linear-gradient(90deg,#fff,#ffd27a);-webkit-background-clip:text;background-clip:text;color:transparent;
       text-shadow:none}
.sub{font:500 26px/1.3 -apple-system,"Helvetica Neue",Arial,sans-serif;color:rgba(255,255,255,0.8);margin-top:6px}
.bar{position:absolute;left:60px;top:286px;height:6px;border-radius:3px;background:#ff5a3c}
</style></head><body>
<div class="bar" id="bar"></div>
<div class="card" id="card"><div class="title">Event name 2026</div><div class="sub">a title over footage</div></div>
<script>
// A title in the past pages' contract: renderAt(t) sets every animated property from t.
window.renderAt = (t) => {
  const k = Math.min(1, t / 0.8);
  const ease = 1 - Math.pow(1 - k, 3);
  document.getElementById("bar").style.width = `${Math.round(420 * ease)}px`;
  const card = document.getElementById("card");
  card.style.opacity = String(Math.min(1, t / 0.5));
  card.style.transform = `translateY(${Math.round(24 * (1 - ease))}px)`;
};
document.fonts.ready.then(() => { window.renderAt(0); window.ready = true; });
</script></body></html>
